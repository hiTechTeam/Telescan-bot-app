[project]
dependencies = [
  "aiogram>=3.22.0",
  "aiohttp>=3.14.3",
  "aiohttp-socks>=0.11.0",
  "pydantic-settings>=2.11.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
]
description = "Add your description here"
name = "telescan-bot-app"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["run_polling.py", "run_webhook.py", "src", "tests"]
exclude = [".venv"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
