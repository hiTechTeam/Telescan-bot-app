name: Deploy Telescan Bot

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-telescan-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx --from ruff==0.16.3 ruff check .
          uvx --from ruff==0.16.3 ruff format --check .

      - name: Type check
        run: uvx --from pyright==1.1.411 pyright

      - name: Test
        run: uv run pytest

      - name: Build
        run: docker build --tag telescan-bot-app:ci .

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          RELEASE_ID=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASES_DIR=/home/ubuntu/telescan/.releases/Telescan-bot-app
          TARGET_DIR=$RELEASES_DIR/$RELEASE_ID
          UPLOAD_DIR="$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "set -Eeuo pipefail; install -d -m 0755 '$RELEASES_DIR'; test ! -e '$TARGET_DIR'; mktemp -d '$RELEASES_DIR/.upload-$RELEASE_ID.XXXXXX'")"

          cleanup_upload() {
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
              "$SERVER_USER@$SERVER_HOST" \
              "test ! -d '$UPLOAD_DIR' || rm -rf -- '$UPLOAD_DIR'" || true
          }
          trap cleanup_upload EXIT
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes' \
            ./ "$SERVER_USER@$SERVER_HOST:$UPLOAD_DIR/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "set -Eeuo pipefail; test -d '$UPLOAD_DIR'; test ! -e '$TARGET_DIR'; test -z \"\$(find '$UPLOAD_DIR' -type l -print -quit)\"; find '$UPLOAD_DIR' -type f -exec chmod 0444 {} +; find '$UPLOAD_DIR' -type d -exec chmod 0555 {} +; chmod 0555 '$UPLOAD_DIR/ops/deploy-production.sh' '$UPLOAD_DIR/ops/recover-deployment.sh'; sudo chown -R root:root '$UPLOAD_DIR'; sudo /usr/bin/python3 '$UPLOAD_DIR/ops/fsync_paths.py' tree '$UPLOAD_DIR'; mv '$UPLOAD_DIR' '$TARGET_DIR'; sudo /usr/bin/python3 '$TARGET_DIR/ops/fsync_paths.py' parents '$RELEASES_DIR'"
          trap - EXIT

      - name: Deploy bot
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_ID=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_DIR=/home/ubuntu/telescan/.releases/Telescan-bot-app/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          CONTROLLER_DIR=/home/ubuntu/telescan/.deploy-controller/Telescan-bot-app
          INTENT_FILE=/home/ubuntu/telescan/.transactions/Telescan-bot-app/active.json
          RECOVERY_SERVICE=telescan-bot-deploy-recovery.service
          RECOVERY_TIMER=telescan-bot-deploy-recovery.timer

          if sudo systemctl cat "$RECOVERY_SERVICE" >/dev/null 2>&1; then
            sudo systemctl start "$RECOVERY_SERVICE"
          fi
          test ! -e "$INTENT_FILE"
          sudo install -d -m 0755 "$CONTROLLER_DIR"
          sudo install -o root -g root -m 0755 \
            "$RELEASE_DIR/ops/recover-deployment.sh" \
            "$CONTROLLER_DIR/recover-deployment.sh"
          sudo install -o root -g root -m 0644 \
            "$RELEASE_DIR/ops/$RECOVERY_SERVICE" \
            "/etc/systemd/system/$RECOVERY_SERVICE"
          sudo install -o root -g root -m 0644 \
            "$RELEASE_DIR/ops/$RECOVERY_TIMER" \
            "/etc/systemd/system/$RECOVERY_TIMER"
          sudo systemctl daemon-reload
          sudo systemctl enable --now "$RECOVERY_TIMER"
          sudo /usr/bin/python3 \
            "$RELEASE_DIR/ops/fsync_recovery_install.py"
          sudo systemctl is-enabled --quiet "$RECOVERY_TIMER"
          sudo systemctl is-active --quiet "$RECOVERY_TIMER"

          sudo systemd-run --wait --collect \
            --unit "telescan-bot-deploy-${{ github.run_id }}-${{ github.run_attempt }}" \
            --property=Type=oneshot \
            --property=TimeoutStartSec=35min \
            --property="OnFailure=$RECOVERY_SERVICE" \
            "$RELEASE_DIR/ops/deploy-production.sh" \
            deploy "$RELEASE_DIR" "$DEPLOY_ID"
          REMOTE
