name: Deploy Telescan Bot

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: telescan-bot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx --from ruff==0.16.3 ruff check .
          uvx --from ruff==0.16.3 ruff format --check .

      - name: Type check
        run: uvx --from pyright==1.1.411 pyright

      - name: Test
        run: uv run pytest

      - name: Build
        run: docker build --tag telescan-bot-app:ci .

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy bot
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/telescan/Telescan-bot-app
          test -z "$(git status --porcelain)"
          git fetch origin main
          git merge --ff-only origin/main
          docker compose config --quiet
          docker compose up -d --build --no-deps telescan-bot-app

          CONTAINER_ID="$(docker compose ps -q telescan-bot-app)"
          test -n "$CONTAINER_ID"
          for attempt in {1..20}; do
            HEALTH_STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          docker compose ps telescan-bot-app
          test "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")" = "healthy"
          REMOTE
