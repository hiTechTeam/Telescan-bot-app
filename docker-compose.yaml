name: telescan-bot-app

services:
  telescan-bot-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 1
    expose:
      - '8080'
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - http://127.0.0.1:8080/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - telescan_network

networks:
  telescan_network:
    driver: bridge
    external: true
